name: Deploy Backend Services

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  AWS_REGION: "ap-south-1"
  EKS_CLUSTER: "orderflow-eks"
  ECR_REGISTRY: "633212682415.dkr.ecr.ap-south-1.amazonaws.com"

# Required for OIDC AWS authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Spring Boot Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::633212682415:role/GitHubActions_OrderFlow_Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Order Service
        run: |
          cd backend/order-service
          mvn clean package -DskipTests
          docker build -t ${{ env.ECR_REGISTRY }}/orderflow-order-service:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/orderflow-order-service:latest .
          docker push ${{ env.ECR_REGISTRY }}/orderflow-order-service:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/orderflow-order-service:latest

      - name: Build Inventory Service
        run: |
          cd backend/inventory-service
          mvn clean package -DskipTests
          docker build -t ${{ env.ECR_REGISTRY }}/orderflow-inventory-service:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/orderflow-inventory-service:latest .
          docker push ${{ env.ECR_REGISTRY }}/orderflow-inventory-service:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/orderflow-inventory-service:latest

      - name: Build Fulfillment Service
        run: |
          cd backend/fulfillment-service
          mvn clean package -DskipTests
          docker build -t ${{ env.ECR_REGISTRY }}/orderflow-fulfillment-service:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/orderflow-fulfillment-service:latest .
          docker push ${{ env.ECR_REGISTRY }}/orderflow-fulfillment-service:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/orderflow-fulfillment-service:latest

      - name: Build Incident Service
        run: |
          cd backend/incident-service
          mvn clean package -DskipTests
          docker build -t ${{ env.ECR_REGISTRY }}/orderflow-incident-service:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/orderflow-incident-service:latest .
          docker push ${{ env.ECR_REGISTRY }}/orderflow-incident-service:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/orderflow-incident-service:latest

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          mkdir kustomize-temp
          cp infrastructure/kubernetes/04-order-service.yaml kustomize-temp/
          cp infrastructure/kubernetes/05-inventory-service.yaml kustomize-temp/
          cp infrastructure/kubernetes/06-fulfillment-service.yaml kustomize-temp/
          cp infrastructure/kubernetes/07-incident-service.yaml kustomize-temp/
          cd kustomize-temp
          kustomize create --resources 04-order-service.yaml,05-inventory-service.yaml,06-fulfillment-service.yaml,07-incident-service.yaml
          kustomize edit set image 633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-order-service=633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-order-service:${{ github.sha }}
          kustomize edit set image 633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-inventory-service=633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-inventory-service:${{ github.sha }}
          kustomize edit set image 633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-fulfillment-service=633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-fulfillment-service:${{ github.sha }}
          kustomize edit set image 633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-incident-service=633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-incident-service:${{ github.sha }}
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/order-service -n orderflow --timeout=120s
          kubectl rollout status deployment/inventory-service -n orderflow --timeout=120s
          kubectl rollout status deployment/fulfillment-service -n orderflow --timeout=120s
          kubectl rollout status deployment/incident-service -n orderflow --timeout=120s

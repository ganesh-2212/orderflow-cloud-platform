apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  POSTGRES_USER: "<set-at-deployment>"
  POSTGRES_PASSWORD: "<set-at-deployment>"
  JWT_SECRET: "<set-at-deployment>"
  JWT_EXPIRATION_MS: "86400000"
  ADMIN_USERNAME: "<set-at-deployment>"
  ADMIN_PASSWORD: "<set-at-deployment>"

apiVersion: batch/v1
kind: CronJob
metadata:
  name: python-processor
  namespace: orderflow
spec:
  # Run every 5 minutes for demonstration purposes
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: python-processor
        spec:
          restartPolicy: OnFailure
          containers:
            - name: python-processor
              image: 633212682415.dkr.ecr.ap-south-1.amazonaws.com/orderflow-python-processor:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.main"]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
              env:
                - name: INCIDENT_SERVICE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: orderflow-config
                      key: INCIDENT_SERVICE_URL
                - name: PROCESSOR_TIMEOUT_SECONDS
                  valueFrom:
                    configMapKeyRef:
                      name: orderflow-config
                      key: PROCESSOR_TIMEOUT_SECONDS
                - name: MAX_REMEDIATION_ATTEMPTS
                  valueFrom:
                    configMapKeyRef:
                      name: orderflow-config
                      key: MAX_REMEDIATION_ATTEMPTS
                - name: PROCESSOR_BATCH_SIZE
                  valueFrom:
                    configMapKeyRef:
                      name: orderflow-config
                      key: PROCESSOR_BATCH_SIZE
                - name: PROCESSOR_DRY_RUN
                  valueFrom:
                    configMapKeyRef:
                      name: orderflow-config
                      key: PROCESSOR_DRY_RUN

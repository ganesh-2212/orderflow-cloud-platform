spring.application.name=inventory-service
server.port=8082

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=Authorization,Content-Type,Accept
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=OrderFlow
info.app.service=inventory-service
info.app.version=1.0.0

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderflow_inventory}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

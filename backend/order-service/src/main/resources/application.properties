spring.application.name=order-service
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=Authorization,Content-Type,Accept
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=OrderFlow
info.app.service=order-service
info.app.version=1.0.0

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderflow_order}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Inventory Service Client
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
inventory.service.timeout-ms=${INVENTORY_SERVICE_TIMEOUT_MS:5000}

# Fulfillment Service Client
fulfillment.service.url=${FULFILLMENT_SERVICE_URL:http://localhost:8083}
fulfillment.service.timeout-ms=${FULFILLMENT_SERVICE_TIMEOUT_MS:5000}

# Incident Service Client
incident.service.url=${INCIDENT_SERVICE_URL:http://localhost:8084}
incident.service.timeout-ms=${INCIDENT_SERVICE_TIMEOUT_MS:5000}

# JWT Security
jwt.secret=${JWT_SECRET:[REDACTED]}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin (Development Only)
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}
